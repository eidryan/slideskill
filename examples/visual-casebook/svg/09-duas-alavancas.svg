<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="O processo e a microestrutura atuam sobre a resistência"><rect width="1280" height="720" fill="#FBFBF8"/><text x="58" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6F818A" text-anchor="start">SÍNTESE DE TESE</text><text x="58" y="116" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1F3545" text-anchor="start">O processo e a microestrutura atuam sobre a resistência</text><text x="65" y="183" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6F818A" text-anchor="start">Sem foto decorativa, sem ícone: um argumento em duas forças</text><text x="85" y="283" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#157987" text-anchor="start">PROCESSAMENTO</text><text x="85" y="351" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">Reduzir</text><text x="85" y="399" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">o tamanho</text><text x="85" y="447" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">dos defeitos</text><text x="754" y="283" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#275B72" text-anchor="start">MICROESTRUTURA</text><text x="754" y="351" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">Aumentar</text><text x="754" y="399" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">a tenacidade</text><text x="754" y="447" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="#1F3545" text-anchor="start">à fratura</text><line x1="601" y1="244" x2="601" y2="554" stroke="#D7E0E1" stroke-width="3" /><text x="641" y="401" font-family="Arial, sans-serif" font-size="48" font-weight="400" fill="#6F818A" text-anchor="start">+</text><rect x="80" y="576" width="1094" height="48" rx="4" fill="#DFE9E9" stroke="none"/><text x="630" y="608" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#1F3545" text-anchor="middle">Os dois caminhos aparecem na equação de Griffith</text><line x1="58" y1="676" x2="1222" y2="676" stroke="#D7E0E1" stroke-width="1" /><text x="58" y="699" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#6F818A" text-anchor="start">Exemplo editorial original; fatores não têm peso quantificado.</text></svg>