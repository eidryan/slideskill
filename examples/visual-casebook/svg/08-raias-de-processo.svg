<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="O QA precisa validar design e conteúdo antes da publicação"><rect width="1280" height="720" fill="#FBFBF8"/><text x="58" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6F818A" text-anchor="start">PROCESSO OPERACIONAL</text><text x="58" y="116" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1F3545" text-anchor="start">O QA precisa validar design e conteúdo antes da publicação</text><text x="66" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6F818A" text-anchor="start">Cada etapa tem uma evidência verificável e um responsável</text><rect x="65" y="230" width="1139" height="100" rx="8" fill="#EDF1F1" stroke="none"/><rect x="65" y="230" width="200" height="100" rx="8" fill="#275B72" stroke="none"/><text x="92" y="290" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">CONTEÚDO</text><text x="297" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#1F3545" text-anchor="start">Tese → evidências → storyboard</text><rect x="65" y="356" width="1139" height="100" rx="8" fill="#E7F1EF" stroke="none"/><rect x="65" y="356" width="200" height="100" rx="8" fill="#157987" stroke="none"/><text x="92" y="416" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">DESIGN</text><text x="297" y="416" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#1F3545" text-anchor="start">Representação → alternativas → visual-spec</text><rect x="65" y="482" width="1139" height="100" rx="8" fill="#EDF1F1" stroke="none"/><rect x="65" y="482" width="200" height="100" rx="8" fill="#275B72" stroke="none"/><text x="92" y="542" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">QA</text><text x="297" y="542" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#1F3545" text-anchor="start">Render → revisão independente → correções</text><text x="70" y="648" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#6F818A" text-anchor="start">A seta representa dependência operacional, não mera decoração.</text><line x1="58" y1="676" x2="1222" y2="676" stroke="#D7E0E1" stroke-width="1" /><text x="58" y="699" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#6F818A" text-anchor="start">Exemplo operacional proposto; não afirma que todas etapas estejam automatizadas.</text></svg>