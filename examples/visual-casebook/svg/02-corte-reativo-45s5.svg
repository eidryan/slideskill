<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="O vidro bioativo cria uma interface de apatita"><rect width="1280" height="720" fill="#FBFBF8"/><text x="58" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#6F818A" text-anchor="start">ESTRUTURA ESPACIAL</text><text x="58" y="116" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#1F3545" text-anchor="start">O vidro bioativo cria uma interface de apatita</text><text x="66" y="167" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#6F818A" text-anchor="start">Representação em corte, esquemática e sem escala</text><rect x="67" y="200" width="745" height="75" rx="0" fill="#EAF4F6" stroke="none"/><text x="87" y="248" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#1F3545" text-anchor="start">FLUIDO FISIOLÓGICO</text><rect x="67" y="275" width="745" height="75" rx="0" fill="#BEDAE0" stroke="none"/><text x="87" y="323" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#1F3545" text-anchor="start">APATITA CARBONATADA (HCA)</text><rect x="67" y="350" width="745" height="75" rx="0" fill="#95BCC4" stroke="none"/><text x="87" y="398" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#1F3545" text-anchor="start">FOSFATO DE CÁLCIO</text><rect x="67" y="425" width="745" height="75" rx="0" fill="#648F9A" stroke="none"/><text x="87" y="473" font-family="Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" text-anchor="start">GEL DE SÍLICA</text><rect x="67" y="500" width="745" height="75" rx="0" fill="#275B72" stroke="none"/><text x="87" y="548" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="start">VIDRO 45S5</text><text x="874" y="217" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#157987" text-anchor="start">01</text><text x="921" y="217" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1F3545" text-anchor="start">Troca iônica (Na⁺/Ca²⁺ ↔ H⁺)</text><text x="874" y="290" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#157987" text-anchor="start">02</text><text x="921" y="290" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1F3545" text-anchor="start">Ruptura das ligações Si–O–Si</text><text x="874" y="363" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#157987" text-anchor="start">03</text><text x="921" y="363" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1F3545" text-anchor="start">Condensação do gel de sílica</text><text x="874" y="436" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#157987" text-anchor="start">04</text><text x="921" y="436" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1F3545" text-anchor="start">Deposição de fosfato de cálcio</text><text x="874" y="509" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#157987" text-anchor="start">05</text><text x="921" y="509" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#1F3545" text-anchor="start">Cristalização em HCA</text><line x1="58" y1="676" x2="1222" y2="676" stroke="#D7E0E1" stroke-width="1" /><text x="58" y="699" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#6F818A" text-anchor="start">Esquema original sem escala; camadas intermediárias são estados simplificados.</text></svg>